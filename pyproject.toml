[build-system]
requires = ["setuptools", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project]
name = "nsi-aura"
dynamic = ["version"]
dependencies = [
    "apscheduler==3.11.3",
    "fastapi[standard]==0.141.1",
    "fastui==0.9.0",
    "lxml==6.1.2",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-statemachine==3.2.1",
    "pytz==2026.3.post1",
    "requests==2.34.2",
    "sqlmodel==0.0.42",
    "structlog==26.1.0",
]
requires-python = ">=3.12"
authors = [
    {name = "Arno Bakker"},
    {name = "Hans Trompert"},
]
maintainers = [
    {name = "Arno Bakker"},
    {name = "Hans Trompert"},
]
description = "Network Service Interface (NSI) ultimate Requester Agent (uRA) for the Advanced North Atlantic (ANA) consortium"
readme = "README.md"
keywords = [
    "ANA",
    "NSI",
    "Python",
]
classifiers = [
]

license = "Apache-2.0"
license-files = ["LICENSE.txt"]

[tool.setuptools]
packages = ["aura", "aura.frontend"]

[tool.setuptools.data-files]
"share/aura/static" = ["static/*"]

[dependency-groups]
dev = [
    "lxml-stubs==0.5.1",
    "mypy==2.3.1",
    "python-statemachine[diagrams]==3.2.1",
    "ruff==0.16.5",
    "types-pytz==2026.3.1.20260727",
    "types-requests==2.33.0.20260712",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[project.urls]
# Homepage =
# Documentation =
Repository = "https://github.com/workfloworchestrator/nsi-aura.git"
# "Bug Tracker" =
# Changelog =

[project.scripts]
nsi-aura = "aura.__main__:main"

[project.gui-scripts]

[tool.ruff]
line-length = 120
target-version = "py313"
lint.select = [
    "ANN",
    "ARG",
    "B",
    "B",
    "C",
    "C",
    "D",
    "D",
    "E",
    "E",
    "F",
    "F",
    "I",
    "I",
    "N",
    "N",
    "PGH",
    "PTH",
    "Q",
    "RET",
    "RET",
    "RUF",
    "S",
    "S",
    "T",
    "T",
    "W",
    "W",
]
lint.ignore = [
    "ANN401",
    "B905",
    "C417",
    "C901",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D213",
    "E501",
    "N801",
    "N802",
    "N803",
    "N805",
    "N806",
    "N815",
    "N816",
    "PGH003",
]
exclude = ["old/*"]
lint.per-file-ignores = { "tests/**" = ["ANN", "ARG002", "S101"], "tests/conftest.py" = ["E402"] }

[tool.mypy]
plugins = ['pydantic.mypy']
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = false
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
